<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Register</title>
</head>
<body>
    <header>
        <h2>Create an account to save your notes accross devices!</h2>
        <nav>
            <ul>
                <a class="button" href="home.html">home</a>
                <a class="button" href="mynotes.html">my notes</a>
                <a class="button" href="login.html">login</a>
                <a class="button" href="#register.html">register</a>
            </ul>
        </nav>
    </header>
    <form>
        <label for="name">name: </label>
        <br>
        <input type="text" id="name">
        <br>
        <label for="username">username: </label>
        <br>
        <input type="text" id="username"> 
        <br>
        <label for="password">password: </label>
        <br>
        <input type="password" id="password">
        <br>
        <label for="confirm password">confirm password: </label>
        <br>
        <input type="password" id="confirmpassword">
        <br>
        <label for="email">email: </label>
        <br>
        <input type="email" id="email">
        <br>
        <label for="confirm email">confirm email: </label>
        <br>
        <input type="email" id="confirmemail">
        <br>
        <input type="submit" value="REGISTER"><br>
        <a class="link" href="login.html">sign in to an existing account</a>
    </form>
</body>
</html>
